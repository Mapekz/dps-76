# Quality gate: lint, format check, typecheck, test. Runs on every PR and on
# push to main — unlike deploy.yml (build + deploy only), this is what
# actually blocks a bad merge.
name: CI

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pinned exact: pnpm 11.12.0's self-installer crashes on bootstrap
          # (pnpm/action-setup#276, open upstream). Do not float on "11" until fixed.
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test
