# Quality gate: lint, format check, typecheck, test. Runs on every PR and on
# push to main — unlike deploy.yml (build + deploy only), this is what
# actually blocks a bad merge.
name: CI

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node stays installed: vite/tsc run under Node via their
      # `#!/usr/bin/env node` shebangs — `bun run` respects that shebang and
      # delegates to Node rather than the Bun runtime. Tests run on the Bun
      # runtime itself (`bun test`), same as script execution
      # (extract/extract:diff/vet:weapons) and package install.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # setup-bun caches the Bun binary but not installed dependencies.
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
